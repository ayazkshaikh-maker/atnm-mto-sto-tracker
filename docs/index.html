<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Al Tasnim ODC Nimr - MTO - STO Status Tracker</title>
<meta name="description" content="Offline single-file tracker: MTO requests vs SAP STO report - pending, approved, issued, double entries and well inventory.">
<style>
:root{--brand:#204393;--accent:#F48323;
--bg:#f2f4f8;--surface:#fff;--surface-2:#f7f8fb;--surface-3:#e9edf3;--border:#dce1e9;--border-2:#c6cdd8;--text:#17202c;--muted:#566173;--faint:#8892a2;
--primary:var(--brand);--primary-ink:#fff;--primary-soft:color-mix(in srgb,var(--brand) 10%,#fff);
--ok:#17803d;--ok-soft:#e2f3e7;--warn:#a85607;--warn-soft:#fdf0dc;--bad:#bf2f28;--bad-soft:#fbe4e2;--info:#2459b8;--info-soft:#e5edfb;--grey:#677285;--grey-soft:#eceef2;
--s-notraised:#d0453b;--s-prior:#b8641a;--s-pending:#ec9a29;--s-approved:#3b6fd6;--s-delivery:#7aa0ea;--s-transit:#1f9b8f;--s-received:#2e9a52;--s-cancel:#9aa3b1;
--shadow:0 1px 2px rgba(16,24,40,.05),0 2px 8px rgba(16,24,40,.05);--r:10px;--pad:16px;--cell:7px 10px;
--font:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;--mono:"Cascadia Mono",Consolas,"SF Mono",Menlo,monospace;color-scheme:light}
:root[data-theme=dark]{--bg:#0d1219;--surface:#151c27;--surface-2:#19212e;--surface-3:#232d3d;--border:#283346;--border-2:#36435a;--text:#e5eaf2;--muted:#a3adbd;--faint:#76819a;
--primary:color-mix(in srgb,var(--brand) 55%,#fff);--primary-ink:#0b1220;--primary-soft:color-mix(in srgb,var(--brand) 30%,#151c27);
--ok:#55c784;--ok-soft:#14301f;--warn:#f0a648;--warn-soft:#33250f;--bad:#f27d73;--bad-soft:#3a1c1b;--info:#7eaaf2;--info-soft:#172640;--grey:#9aa3b1;--grey-soft:#232b38;
--s-notraised:#e2645a;--s-prior:#cf8340;--s-pending:#f0aa45;--s-approved:#6390ea;--s-delivery:#93b2ef;--s-transit:#3bb5a8;--s-received:#4cb672;--s-cancel:#7c8596;--shadow:0 1px 2px rgba(0,0,0,.35);color-scheme:dark}
:root[data-density=compact]{--pad:11px;--cell:4px 8px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased}
a{color:var(--primary)}
code{font-family:var(--mono);font-size:.88em;background:var(--surface-3);padding:1px 5px;border-radius:4px}
h1,h2,h3,h4{margin:0;line-height:1.25}
h1{font-size:18px;font-weight:650}
h2{font-size:15px;font-weight:650}
h3{font-size:13px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
h4{font-size:12px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:18px 0 8px}
.mt{margin-top:16px}.small{font-size:12px}.muted{color:var(--muted)}.mono{font-family:var(--mono);font-size:12px}.grow{flex:1}
.t-bad{color:var(--bad)}.t-warn{color:var(--warn)}
.ic{width:18px;height:18px;fill:currentColor;flex:none}.ic.big{width:34px;height:34px;opacity:.6}
#app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
#side{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:16px 14px 12px;border-bottom:1px solid var(--border)}
.brand img{width:44px;height:52px;object-fit:contain;background:#fff;border-radius:6px;padding:2px}
.brand b{display:block;font-size:13px;line-height:1.25}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
nav{padding:10px 8px;display:flex;flex-direction:column;gap:2px}
nav button{display:flex;align-items:center;gap:10px;border:0;background:none;color:var(--muted);padding:9px 10px;border-radius:8px;font:inherit;font-size:13.5px;cursor:pointer;text-align:left}
nav button:hover{background:var(--surface-2);color:var(--text)}
nav button.on{background:var(--primary-soft);color:var(--primary);font-weight:600}
nav button em{margin-left:auto;font-style:normal;font-size:11px;background:var(--bad-soft);color:var(--bad);padding:1px 7px;border-radius:10px;font-weight:600}
.side-foot{margin-top:auto;padding:12px 14px;border-top:1px solid var(--border);font-size:11.5px;color:var(--muted);display:grid;gap:3px}
main{min-width:0;display:flex;flex-direction:column}
#top{position:sticky;top:0;z-index:20;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 20px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.scope{display:flex;gap:8px;flex-wrap:wrap}.scope label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.scope select{max-width:260px}
#view{padding:18px 20px 40px;display:flex;flex-direction:column;gap:16px;min-width:0}
select,input,textarea{font:inherit;font-size:13px;color:var(--text);background:var(--surface);border:1px solid var(--border-2);border-radius:7px;padding:6px 8px;min-width:0}
input[type=checkbox]{width:15px;height:15px;accent-color:var(--primary)}
input[type=color]{padding:2px;height:34px;width:60px}
select:focus,input:focus,textarea:focus,button:focus-visible{outline:2px solid color-mix(in srgb,var(--primary) 50%,transparent);outline-offset:1px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border-2);background:var(--surface);color:var(--text);padding:7px 12px;border-radius:8px;font:inherit;font-size:13px;font-weight:550;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface-2)}.btn .ic{width:16px;height:16px}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}.btn.danger:hover{background:var(--bad-soft)}
.btn.ghost{border-color:transparent;background:none}
.btn[disabled],.btn.disabled{opacity:.5;pointer-events:none}
.btn.admin-on{border-color:var(--ok);color:var(--ok)}
.icon-btn{display:inline-grid;place-items:center;width:34px;height:34px;border:1px solid var(--border-2);border-radius:8px;background:var(--surface);color:var(--text);cursor:pointer}
.only-m{display:none}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:var(--pad);box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap}
.card-h small{color:var(--muted);font-size:12px}
.cards{display:grid;gap:16px}.c2{grid-template-columns:repeat(2,minmax(0,1fr))}.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.asof{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 12px}
.asof .ic{width:16px;height:16px;color:var(--primary)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--primary);border-radius:var(--r);padding:11px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px}
.kpi span{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.kpi b{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi small{font-size:11.5px;color:var(--muted)}
.kpi.warn{border-left-color:var(--s-pending)}.kpi.bad{border-left-color:var(--s-notraised)}
.click{cursor:pointer}.kpi.click:hover,.card.click:hover{border-color:var(--primary)}
.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.bar label{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.bar select{max-width:420px}
.row-btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
/* badges & chips */
.badge{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap;line-height:1.5;border:1px solid transparent}
.s-notraised{background:color-mix(in srgb,var(--s-notraised) 15%,var(--surface));color:var(--s-notraised);border-color:color-mix(in srgb,var(--s-notraised) 30%,transparent)}
.s-prior{background:color-mix(in srgb,var(--s-prior) 15%,var(--surface));color:var(--s-prior);border-color:color-mix(in srgb,var(--s-prior) 30%,transparent)}
.s-pending{background:color-mix(in srgb,var(--s-pending) 17%,var(--surface));color:color-mix(in srgb,var(--s-pending) 70%,var(--text));border-color:color-mix(in srgb,var(--s-pending) 35%,transparent)}
.s-approved{background:color-mix(in srgb,var(--s-approved) 14%,var(--surface));color:var(--s-approved);border-color:color-mix(in srgb,var(--s-approved) 30%,transparent)}
.s-delivery{background:color-mix(in srgb,var(--s-delivery) 16%,var(--surface));color:color-mix(in srgb,var(--s-delivery) 60%,var(--text))}
.s-transit{background:color-mix(in srgb,var(--s-transit) 14%,var(--surface));color:var(--s-transit)}
.s-received{background:color-mix(in srgb,var(--s-received) 14%,var(--surface));color:var(--s-received);border-color:color-mix(in srgb,var(--s-received) 30%,transparent)}
.s-cancel{background:var(--grey-soft);color:var(--grey)}
.k-req{background:var(--info-soft);color:var(--info)}.k-sap{background:var(--ok-soft);color:var(--ok)}.k-design,.k-po{background:var(--grey-soft);color:var(--muted)}.k-unknown,.k-error{background:var(--bad-soft);color:var(--bad)}
.chip{display:inline-block;font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:5px;margin:1px 3px 1px 0;background:var(--grey-soft);color:var(--muted);white-space:nowrap}
.chip.man{background:var(--primary-soft);color:var(--primary);margin-left:4px}
.f-bad{background:var(--bad-soft);color:var(--bad)}.f-warn{background:var(--warn-soft);color:var(--warn)}.f-info{background:var(--info-soft);color:var(--info)}
.dept{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;white-space:nowrap}
.dept:before{content:"";width:8px;height:8px;border-radius:2px;background:var(--grey)}
.d-electrical:before{background:#d99a1e}.d-mechanical:before{background:#3b6fd6}.d-instrument:before{background:#18a090}.d-civil:before{background:#8a6d4a}
.sev{font-size:11px;font-weight:700;padding:1px 7px;border-radius:5px}.sev.v3{background:var(--bad-soft);color:var(--bad)}.sev.v2{background:var(--warn-soft);color:var(--warn)}.sev.v1,.sev.v0{background:var(--info-soft);color:var(--info)}
/* grid */
.grid{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);min-width:0;display:flex;flex-direction:column}
.g-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 12px;border-bottom:1px solid var(--border)}
.g-tools select{max-width:170px;font-size:12.5px}
.search{display:flex;align-items:center;gap:6px;border:1px solid var(--border-2);border-radius:8px;padding:0 8px;background:var(--surface);min-width:200px;flex:0 1 280px}
.search input{border:0;padding:6px 0;width:100%;background:none}.search input:focus{outline:none}.search .ic{width:16px;height:16px;color:var(--faint)}
.g-count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.seg{display:inline-flex;border:1px solid var(--border-2);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);color:var(--muted);font:inherit;font-size:12px;padding:5px 10px;cursor:pointer;border-right:1px solid var(--border)}
.seg button:last-child{border-right:0}.seg button.on{background:var(--primary);color:var(--primary-ink)}
.g-bulk{display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--primary-soft);border-bottom:1px solid var(--border);font-size:13px;flex-wrap:wrap}
.tbl-wrap{overflow:auto;max-height:calc(100vh - 230px);min-height:120px}
.tbl{border-collapse:separate;border-spacing:0;width:100%;font-size:12.8px}
.tbl th{position:sticky;top:0;z-index:2;background:var(--surface-2);color:var(--muted);font-weight:650;font-size:11.5px;text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none}
.tbl th:hover{color:var(--text)}
.tbl th .sorti:after{content:"";margin-left:4px;opacity:.35}.tbl th.sorted .sorti:after{content:"\25B2";opacity:1;font-size:9px}.tbl th.sorted.desc .sorti:after{content:"\25BC"}
.tbl td{padding:var(--cell);border-bottom:1px solid var(--border);vertical-align:top;white-space:nowrap}
.tbl td.wrap{white-space:normal;min-width:180px;max-width:360px}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tbl .ck{width:30px;padding-right:0}
.tbl tr.click:hover td{background:var(--surface-2)}
.tbl tr.hl-bad td:first-child{box-shadow:inset 3px 0 0 var(--s-notraised)}.tbl tr.hl-warn td:first-child{box-shadow:inset 3px 0 0 var(--s-pending)}
.tbl td.empty{text-align:center;color:var(--muted);padding:30px}
.g-pager{display:flex;gap:4px;align-items:center;padding:8px 12px;border-top:1px solid var(--border);font-size:12px;color:var(--muted);flex-wrap:wrap}
.g-pager button{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:6px;padding:3px 9px;font:inherit;font-size:12px;cursor:pointer}
.g-pager button.on{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}.g-pager button:disabled{opacity:.4;cursor:default}
.g-pager select{padding:2px 4px;font-size:12px}
table.mini{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:10px}
table.mini th{text-align:left;color:var(--muted);font-size:11px;font-weight:650;padding:5px 6px;border-bottom:1px solid var(--border)}
table.mini td{padding:5px 6px;border-bottom:1px solid var(--border)}table.mini .num{text-align:right;font-variant-numeric:tabular-nums}
table.mini tr.click:hover td{background:var(--surface-2)}
/* charts */
.stack{display:flex;width:100%;border-radius:6px;overflow:hidden;background:var(--surface-3)}.stack span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:8px}.legend.col{flex-direction:column;gap:5px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}.legend b{color:var(--text)}.legend em{font-style:normal;opacity:.8}
.donut-wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.donut .d-c{font-size:22px;font-weight:700;fill:var(--text)}.donut .d-s{font-size:11px;fill:var(--muted)}
.barsH{display:flex;flex-direction:column;gap:7px}
.bh-row{display:grid;grid-template-columns:minmax(90px,170px) 1fr 54px;gap:10px;align-items:center;font-size:12.5px}
.bh-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bh-label small{display:block;color:var(--muted);font-size:10.5px;overflow:hidden;text-overflow:ellipsis}
.bh-track{background:var(--surface-3);height:10px;border-radius:5px;overflow:hidden}.bh-fill{height:100%;border-radius:5px}
.bh-val{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}.bh-row.click:hover .bh-label{color:var(--primary)}
.cols{display:flex;gap:10px;align-items:flex-end;padding-top:18px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:11.5px}
.col span{width:100%;max-width:48px;border-radius:5px 5px 0 0;min-height:2px}.col em{font-style:normal;color:var(--muted)}.col b{font-variant-numeric:tabular-nums}
.dep-row{margin-bottom:12px}.dep-h{display:flex;justify-content:space-between;margin-bottom:5px}.dep-h small{color:var(--muted);font-size:11.5px}
.uqs{display:flex;flex-wrap:wrap;gap:6px}.uq{display:inline-block;background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:2px 7px;font-size:12px;font-variant-numeric:tabular-nums;margin:1px 2px}
.uq small{color:var(--muted)}
.pbar{position:relative;width:110px;height:16px;background:var(--surface-3);border-radius:4px;overflow:hidden}.pbar span{display:block;height:100%;background:var(--s-received)}.pbar em{position:absolute;inset:0;font-style:normal;font-size:11px;text-align:center;line-height:16px;font-weight:600}
/* callouts & insights */
.callouts{display:grid;gap:8px;margin-top:12px}
.callout{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:8px;font-size:13px;background:var(--info-soft);color:var(--text);border:1px solid color-mix(in srgb,var(--info) 25%,transparent)}
.callout .ic{color:var(--info);margin-top:1px}
.callout.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}.callout.warn .ic{color:var(--warn)}
.callout.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 30%,transparent)}.callout.bad .ic{color:var(--bad)}
.flaglist{display:grid;gap:6px;margin-top:12px}.flaglist .callout{flex-direction:column;gap:2px;font-size:12.5px}
.insights{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.insights li{padding:8px 12px;border-radius:8px;font-size:13px;border-left:3px solid var(--info);background:var(--surface-2)}
.insights li.warn{border-left-color:var(--s-pending)}.insights li.bad{border-left-color:var(--s-notraised)}
.flag-sum{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.fs{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:1px solid var(--border);border-radius:var(--r);padding:10px 12px;cursor:pointer;font:inherit;text-align:left;background:var(--surface)}
.fs b{font-size:22px}.fs span{font-size:12px}.fs:hover{border-color:var(--primary)}
.fs.f-bad b{color:var(--bad)}.fs.f-warn b{color:var(--warn)}.fs.f-info b{color:var(--info)}
/* wells */
.well-h{display:grid;grid-template-columns:minmax(200px,1fr) 2fr;gap:20px}.well-h h2{font-size:28px}.well-h p{margin:4px 0 0;color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.tabs button{border:0;background:none;font:inherit;font-size:13px;padding:8px 14px;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer}
.tabs button.on{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}.tabs small{opacity:.7}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:5px 14px;margin:12px 0;font-size:13px}.kv dt{color:var(--muted)}.kv dd{margin:0;word-break:break-word}.kv.sm{font-size:12.5px;margin:0}
/* modal & drawer */
#modal,#drawer{position:fixed;inset:0;z-index:100}
.m-back,.d-back{position:absolute;inset:0;background:rgba(10,15,25,.45)}
.m-box{position:relative;margin:6vh auto;width:min(560px,calc(100% - 32px));max-height:88vh;display:flex;flex-direction:column;background:var(--surface);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.3);border:1px solid var(--border)}
.m-box.wide{width:min(1000px,calc(100% - 32px))}
.m-head,.d-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border);gap:10px}
.m-head h3,.d-head h3{font-size:15px;text-transform:none;letter-spacing:0;color:var(--text)}
.m-body{padding:16px;overflow:auto}.m-body p:first-child{margin-top:0}
.m-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--border)}
.d-box{position:absolute;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--surface);display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.2);animation:slide .18s ease-out}
@keyframes slide{from{transform:translateX(30px);opacity:.6}}
.d-head h3{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.d-body{padding:16px;overflow:auto;flex:1}
.d-sum{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.qgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px;margin-top:12px}
.qgrid div{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:7px 9px}.qgrid small{display:block;color:var(--muted);font-size:11px}.qgrid b{font-size:16px;font-variant-numeric:tabular-nums}
.form2{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}.span2{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}.fld>span{font-weight:600}
.fld.inline{flex-direction:row;align-items:center;gap:6px;flex-wrap:wrap}
.chk{display:flex;gap:8px;align-items:center;font-size:13px}
details{margin-top:14px;border:1px solid var(--border);border-radius:8px;padding:8px 12px}details summary{cursor:pointer;font-weight:600;font-size:13px}details .form2{margin-top:10px}
.sticky-foot{position:sticky;bottom:-16px;background:var(--surface);padding:12px 0;border-top:1px solid var(--border);margin-top:16px}
.hist{margin:0;padding-left:18px;font-size:12.5px}
.toast-wrap,#toasts{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:min(420px,calc(100% - 32px))}
.toast{background:var(--text);color:var(--bg);padding:10px 14px;border-radius:8px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.25);transition:opacity .3s,transform .3s;border-left:4px solid var(--info)}
.toast.t-ok{border-left-color:var(--ok)}.toast.t-warn{border-left-color:var(--s-pending)}.toast.t-bad{border-left-color:var(--bad)}.toast.out{opacity:0;transform:translateY(8px)}
.busy{position:fixed;inset:0;z-index:300;background:rgba(10,15,25,.45);display:grid;place-items:center}
.busy div{background:var(--surface);padding:18px 22px;border-radius:10px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow)}
.spin{width:18px;height:18px;border:3px solid var(--surface-3);border-top-color:var(--primary);border-radius:50%;animation:sp 0.8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
/* welcome & sources */
.welcome{max-width:820px;margin:20px auto;text-align:left}.welcome h2{font-size:22px;margin:8px 0}.w-logo{width:70px}
.ticks{padding-left:18px}.ticks li{margin:6px 0}
.drop{border:2px dashed var(--border-2);border-radius:12px;padding:26px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;background:var(--surface-2)}
.drop.over{border-color:var(--primary);background:var(--primary-soft)}.drop span{color:var(--muted);font-size:12.5px}
.xcard h2{margin-bottom:6px}
.swatch{width:28px;height:28px;border-radius:7px;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--border-2);cursor:pointer}
.logo-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.logo-row img{height:48px;background:#fff;border-radius:6px;padding:2px;border:1px solid var(--border)}
.audit{max-height:280px;overflow:auto;font-size:12px;display:grid;gap:2px}
.audit div{display:grid;grid-template-columns:112px minmax(0,1fr) auto;gap:2px 8px;padding:5px 0;border-bottom:1px solid var(--border)}.audit div span{grid-column:1/-1;grid-row:2}.audit div em{grid-column:3;grid-row:1}
.audit time{color:var(--muted);font-family:var(--mono);font-size:11px}.audit span{color:var(--muted);word-break:break-word}.audit em{color:var(--faint)}
.about ol{padding-left:18px}.about li{margin:6px 0}
[hidden]{display:none!important}
@media (max-width:1200px){.c3{grid-template-columns:1fr 1fr}}
@media (max-width:900px){
  #app{grid-template-columns:1fr}
  #side{position:fixed;z-index:60;left:0;top:0;width:270px;transform:translateX(-105%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.3)}
  body.nav-open #side{transform:none}
  .only-m{display:inline-grid}.c2,.c3,.well-h{grid-template-columns:1fr}
  #top{padding:10px 16px}#view{padding:14px 16px 40px}#top h1{font-size:16px}
  .btn span{display:none}.btn[data-import] span{display:none}
  .form2{grid-template-columns:1fr}
  .search{flex:1 1 100%}
}
@media print{#side,#top,.g-tools,.g-pager,.row-btns{display:none!important}#app{display:block}.tbl-wrap{max-height:none;overflow:visible}body{background:#fff}}

.sync-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border-2);background:var(--surface);color:var(--muted);border-radius:20px;padding:4px 10px;font:inherit;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.sync-chip .ic{width:15px;height:15px}
.sc-ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.sc-pending,.sc-saving,.sc-pulling{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.sc-error{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
@media (max-width:900px){.sync-chip span{display:none}}

</style>
</head>
<body>
<div id="app">
  <aside id="side" aria-label="Navigation"></aside>
  <main><header id="top"></header><div id="view" tabindex="-1"></div></main>
</div>
<div id="drawer" hidden></div>
<div id="modal" hidden></div>
<div id="toasts" aria-live="polite"></div>
<noscript>This tracker needs JavaScript enabled.</noscript>

/* tiny SHA-256 (works on file:// where crypto.subtle may be unavailable) */
function sha256(str) {
  const s = unescape(encodeURIComponent(str)); const K = []; const H = []; let p = 0;
  const isP = n => { for (let f = 2; f * f <= n; f++) if (n % f === 0) return false; return true; };
  for (let c = 2; p < 64; c++) if (isP(c)) { if (p < 8) H[p] = (Math.pow(c, .5) * 4294967296) | 0; K[p++] = (Math.pow(c, 1 / 3) * 4294967296) | 0; }
  const words = []; const bl = s.length * 8;
  for (let i = 0; i < s.length; i++) words[i >> 2] |= s.charCodeAt(i) << ((3 - i) % 4) * 8;
  words[s.length >> 2] |= 0x80 << (24 - (s.length % 4) * 8);
  words[((s.length + 8) >> 6) * 16 + 15] = bl;
  const rr = (v, n) => (v >>> n) | (v << (32 - n));
  let h = H.slice();
  for (let j = 0; j < words.length; j += 16) {
    const w = words.slice(j, j + 16); const o = h.slice();
    for (let i = 0; i < 64; i++) {
      if (i >= 16) { const w15 = w[i - 15], w2 = w[i - 2]; w[i] = (w[i - 16] + (rr(w15, 7) ^ rr(w15, 18) ^ (w15 >>> 3)) + w[i - 7] + (rr(w2, 17) ^ rr(w2, 19) ^ (w2 >>> 10))) | 0; }
      const a = h[0], e = h[4];
      const t1 = h[7] + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25)) + ((e & h[5]) ^ (~e & h[6])) + K[i] + (w[i] | 0);
      const t2 = (rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & h[1]) ^ (a & h[2]) ^ (h[1] & h[2]));
      h = [(t1 + t2) | 0].concat(h); h[4] = (h[4] + t1) | 0; h.length = 8;
    }
    for (let i = 0; i < 8; i++) h[i] = (h[i] + o[i]) | 0;
  }
  return h.map(v => ('00000000' + (v >>> 0).toString(16)).slice(-8)).join('');
}

/* ---------------- workbook parsing ---------------- */
function findHeader(rows, pred, max = 40) { for (let i = 0; i < Math.min(rows.length, max); i++) { const h = (rows[i] || []).map(norm); if (pred(h)) return i; } return -1; }
function colMap(hdr, aliases) {
  const h = hdr.map(norm); const used = new Set(); const m = {};
  for (const k in aliases) for (const a of aliases[k]) { const i = h.indexOf(norm(a)); if (i >= 0 && !used.has(i)) { m[k] = i; used.add(i); break; } }
  for (const k in aliases) { if (m[k] != null) continue; for (const a of aliases[k]) { const na = norm(a); if (na.length < 4) continue; const i = h.findIndex((x, j) => !used.has(j) && x && (x.startsWith(na) || x.includes(na))); if (i >= 0) { m[k] = i; used.add(i); break; } } }
  return m;
}
const cellStr = v => v == null ? '' : (typeof v === 'number' ? String(v) : String(v).trim());

function analyzeWorkbook(wb, file) {
  const out = []; const fileDate = dateFromName(file.name);
  const req = { kind: 'req', file: file.name, sig: file.sig, date: fileDate, dateSrc: fileDate ? 'file name' : 'today', sheets: [], lines: [], header: null };
  for (const sn of wb.SheetNames) {
    const ws = wb.Sheets[sn]; if (!ws || !ws['!ref']) continue;
    const rows = XL.utils.sheet_to_json(ws, { header: 1, defval: null, raw: true, blankrows: false });
    if (!rows.length) continue;
    let hi = findHeader(rows, h => h.includes('request sto') && h.includes('sto status'));
    if (hi >= 0) { out.push(parseSAP(rows, hi, file, sn, fileDate)); continue; }
    hi = findHeader(rows, h => h.includes('sap po') && h.includes('description') && (h.includes('l no') || h.includes('line')));
    if (hi >= 0) { out.push(parsePO(rows, hi, file, sn)); continue; }
    hi = findHeader(rows, h => (h.includes('material') || h.includes('material number') || h.includes('sap no')) && h.some(x => /^(request|requested|req|required) qty/.test(x)));
    if (hi >= 0) { parseReqSheet(rows, hi, sn, req); continue; }
    hi = findHeader(rows, h => h.includes('description') && h.some(x => x.startsWith('qty')) && h.some(x => x.startsWith('sap no') || x === 'm e s c' || x.includes('mesc')));
    if (hi >= 0) { out.push(parseDesign(rows, hi, file, sn)); continue; }
  }
  if (req.lines.length) { if (!req.date) req.date = todayISO(); req.wells = uniq(req.lines.map(l => l.wellId)); out.unshift(req); }
  return out;
}

function parseReqSheet(rows, hi, sn, req) {
  const hdr = rows[hi].map(cellStr); const m = colMap(hdr, REQ_ALIASES);
  if (!req.header) req.header = hdr.filter((x, i) => x || i < hdr.length);
  req.sheets.push(sn);
  const g = (r, k) => m[k] == null ? null : r[m[k]];
  const sheetWell = /^\d{2,6}$/.test(String(sn).trim()) ? normWell(sn) : '';
  for (let i = hi + 1; i < rows.length; i++) {
    const r = rows[i] || []; const material = normMat(g(r, 'material')); const desc = cellStr(g(r, 'desc'));
    if (!material && !desc) continue;
    if (/^total/i.test(cellStr(r[0])) && !material) continue;
    const constWBS = cellStr(g(r, 'constWBS'));
    let wellId = normWell(g(r, 'wellId')) || wellFromWBS(constWBS) || sheetWell || '(no well)';
    const sapRaw = g(r, 'sapQty');
    req.lines.push({
      idx: req.lines.length, sheet: sn, sr: cellStr(g(r, 'sr')) || String(req.lines.length + 1), material, desc, uom: cellStr(g(r, 'uom')),
      reqQty: num(g(r, 'reqQty')), sapQty: (sapRaw == null || sapRaw === '') ? null : num(sapRaw), plant: cellStr(g(r, 'plant')), sloc: cellStr(g(r, 'sloc')),
      slocDesc: cellStr(g(r, 'slocDesc')), batch: cellStr(g(r, 'batch')), valType: cellStr(g(r, 'valType')), constWBS, wellType: cellStr(g(r, 'wellType')), wellId,
      procWBS: cellStr(g(r, 'procWBS')), docHeader: cellStr(g(r, 'docHeader')), ramzId: cellStr(g(r, 'ramzId')), servicePO: cellStr(g(r, 'servicePO')),
      stoPO: cellStr(g(r, 'stoPO')), postingStatus: cellStr(g(r, 'postingStatus')), col1: cellStr(g(r, 'col1')), dept: normDept(g(r, 'dept'))
    });
  }
}

function parseSAP(rows, hi, file, sn, fileDate) {
  const m = colMap(rows[hi].map(cellStr), SAP_ALIASES); const g = (r, k) => m[k] == null ? null : r[m[k]];
  const lines = []; let maxD = '';
  for (let i = hi + 1; i < rows.length; i++) {
    const r = rows[i] || []; const sto = cellStr(g(r, 'sto')).replace(/\.0+$/, ''); if (!sto) continue;
    const reqOn = anyToISO(g(r, 'reqOn'), false); if (reqOn > maxD) maxD = reqOn;
    const tgtWBS = cellStr(g(r, 'tgtWBS')); const remarks = cellStr(g(r, 'remarks'));
    let wellId = wellFromWBS(tgtWBS);
    if (!/^\d+$/.test(wellId)) { const mm = remarks.match(/^\s*(\d{3,6})\b/); if (mm) wellId = normWell(mm[1]); }
    lines.push({
      sto, item: String(num(g(r, 'item')) || cellStr(g(r, 'item'))), type: cellStr(g(r, 'type')), status: cellStr(g(r, 'status')) || cellStr(g(r, 'status0')),
      material: normMat(g(r, 'material')), desc: cellStr(g(r, 'desc')), srcPlant: cellStr(g(r, 'srcPlant')), srcSloc: cellStr(g(r, 'srcSloc')),
      srcSlocDesc: cellStr(g(r, 'srcSlocDesc')), srcWBS: cellStr(g(r, 'srcWBS')), batchNo: cellStr(g(r, 'batchNo')), qty: num(g(r, 'qty')), uom: cellStr(g(r, 'uom')),
      tgtPlant: cellStr(g(r, 'tgtPlant')), tgtSloc: cellStr(g(r, 'tgtSloc')), tgtWBS, tgtWBSDesc: cellStr(g(r, 'tgtWBSDesc')), po: cellStr(g(r, 'po')),
      poItem: cellStr(g(r, 'poItem')), ramz: cellStr(g(r, 'ramz')), recv: num(g(r, 'recv')), consumed: num(g(r, 'consumed')), ret: num(g(r, 'ret')),
      avail: num(g(r, 'avail')), remarks, reqBy: cellStr(g(r, 'reqBy')), reqOn, tfDoc: cellStr(g(r, 'tfDoc')), delivery: cellStr(g(r, 'delivery')),
      pgiDoc: cellStr(g(r, 'pgiDoc')), grDoc: cellStr(g(r, 'grDoc')), wellId: wellId || '(no well)'
    });
  }
  const date = fileDate || maxD || todayISO();
  return { kind: 'sap', file: file.name, sig: file.sig, sheet: sn, date, dateSrc: fileDate ? 'file name' : (maxD ? 'latest request date' : 'today'), lines, wells: uniq(lines.map(l => l.wellId)) };
}

function parseDesign(rows, hi, file, sn) {
  const lab = re => { for (let i = 0; i < hi; i++) { const r = rows[i] || []; for (let j = 0; j < r.length; j++) { const c = cellStr(r[j]); if (re.test(c)) { const after = c.split(':').slice(1).join(':').trim(); if (after) return after; for (let k = j + 1; k < r.length; k++) if (cellStr(r[k])) return cellStr(r[k]); } } } return ''; };
  const meta = { jobNo: lab(/^\s*job\s*no/i), projectId: lab(/project\s*id/i), wbs: lab(/^\s*wbs/i), docNo: lab(/^\s*doc\.?\s*no/i), jobTitle: lab(/job\s*title/i), area: lab(/^\s*area\b/i) };
  const h = rows[hi].map(norm); const fi = f => h.findIndex(f);
  const c = { sr: fi(x => x.startsWith('sr')), desc: fi(x => x === 'description'), qty: fi(x => x.startsWith('qty')), unit: fi(x => x.startsWith('unit')), mesc: fi(x => x === 'm e s c' || x.includes('mesc')), sap: fi(x => x.startsWith('sap no')), rem: fi(x => x.startsWith('remark')) };
  const lines = []; let section = '';
  for (let i = hi + 1; i < rows.length; i++) {
    const r = rows[i] || []; const first = cellStr(r[0]);
    if (/^(note|rev\b|project drawing)/i.test(first)) break;
    const desc = c.desc >= 0 ? cellStr(r[c.desc]) : ''; const q = c.qty >= 0 ? r[c.qty] : null;
    if (!desc && (q == null || q === '') && first && !/^\d+$/.test(first)) { section = first; continue; }
    if (!desc) continue;
    lines.push({ sr: c.sr >= 0 ? cellStr(r[c.sr]) : '', desc, qty: num(q), unit: c.unit >= 0 ? cellStr(r[c.unit]) : '', mesc: c.mesc >= 0 ? cellStr(r[c.mesc]) : '', material: c.sap >= 0 ? normMat(r[c.sap]) : '', remarks: c.rem >= 0 ? cellStr(r[c.rem]) : '', section });
  }
  return { kind: 'design', file: file.name, sig: file.sig, sheet: sn, meta, wellId: wellFromWBS(meta.wbs) || '(no well)', lines, date: dateFromName(file.name) || '' };
}

function parsePO(rows, hi, file, sn) {
  const h = rows[hi].map(norm); const fi = f => h.findIndex(f);
  const c = { po: fi(x => x === 'sap po'), line: fi(x => x === 'l no' || x === 'line'), date: fi(x => x.startsWith('p o issued') || x.includes('issued')), loc: fi(x => x === 'loc' || x === 'location'), desc: fi(x => x === 'description'), cla: fi(x => x === 'cla') };
  const map = {}; let n = 0;
  for (let i = hi + 1; i < rows.length; i++) {

function insights(REC, STO, AG, FL, batch, BR) {
  const out = []; const add = (tone, html) => out.push({ tone, html });
  if (batch) {
    const iss = BR.filter(r => r.group === 'issued').length, ap = BR.filter(r => r.group === 'approved').length, nr = BR.filter(r => r.stage === 'NOT_RAISED').length, pe = BR.filter(r => r.stage === 'PENDING_PE').length, pr = BR.filter(r => r.stage === 'PRIOR_PENDING').length;
    add('info', `MTO <b>${fmtDate(batch.date)}</b>: ${BR.length} lines - <b>${iss}</b> issued, <b>${ap}</b> approved, <b>${pe}</b> pending PE, <b>${nr}</b> not raised in SAP${pr ? `, <b>${pr}</b> waiting under an earlier STO` : ''}.`);
    const nrD = {}; BR.filter(r => r.stage === 'NOT_RAISED').forEach(r => nrD[r.dept] = (nrD[r.dept] || 0) + 1);
    const nrS = Object.entries(nrD).sort((a, b) => b[1] - a[1]); if (nrS.length) add('bad', `Not raised in SAP by discipline: ${nrS.map(([d, n]) => `${esc(d)} <b>${n}</b>`).join(', ')}. These need an STO or the PE's decision.`);
  }
  const ar = FL.filter(f => f.code === 'ALREADY_REQ'); if (ar.length) add('warn', `<b>${uniq(ar.map(f => f.wellId + '|' + f.material)).length}</b> material(s) were requested again while an earlier STO for the same well is still open. Do not count them as new demand.`);
  const dup = STO.filter(l => l.flags.some(f => f.code === 'SAME_DAY')); if (dup.length) { const q = {}; dup.forEach(l => q[l.uom] = (q[l.uom] || 0) + l.qty); add('bad', `<b>${uniq(dup.map(l => l.wellId + '|' + l.material)).length}</b> material(s) raised more than once on the same day (${uniq(dup.map(l => l.sto)).length} STOs). Ask the PE to cancel the duplicate STO lines.`); }
  const ov = AG.filter(a => a.flagMap.has('OVER_RAISED')); if (ov.length) add('bad', `<b>${ov.length}</b> well x material line(s) have more open qty in SAP than is still outstanding - likely duplicates.`);
  const aged = STO.filter(l => l.group === 'pending' && l.age > S.settings.agedDays); if (aged.length) { const o = aged.reduce((a, b) => (b.age > a.age ? b : a)); add('warn', `<b>${fmtI(aged.length)}</b> STO lines pending PE for more than ${S.settings.agedDays} days. Oldest: STO ${esc(o.sto)} (${o.age} days, well ${esc(o.wellId)}).`); }
  const open = STO.filter(l => l.open); if (open.length) { const w = {}; open.forEach(l => w[l.wellId] = (w[l.wellId] || 0) + 1); const t = Object.entries(w).sort((a, b) => b[1] - a[1])[0]; add('info', `Most open STO lines: well <a href="#" data-gowell="${esc(t[0])}">${esc(t[0])}</a> with <b>${fmtI(t[1])}</b> lines.`); }
  const ls = REC.filter(r => r.flags.some(f => f.code === 'LOW_STOCK') && r.group === 'pending'); if (ls.length) add('info', `<b>${ls.length}</b> pending MTO line(s) had SAP stock below the requested qty at request time - may need procurement.`);
  return out;
}

function pickFiles(folder) {

  const inp = document.createElement('input'); inp.type = 'file'; inp.multiple = true; inp.accept = '.xlsx,.xlsm,.xls,.json';
  if (folder) inp.webkitdirectory = true;

}
function bindDrop(el) {
  const z = el.querySelector('[data-drop]'); if (!z) return;
  z.addEventListener('dragover', e => { e.preventDefault(); z.classList.add('over'); });
  z.addEventListener('dragleave', () => z.classList.remove('over'));
  z.addEventListener('drop', e => { e.preventDefault(); z.classList.remove('over'); if (!S.settings.viewerImport && !isAdmin()) return needAdmin(); handleFiles([...e.dataTransfer.files]); });
}
const isXl = f => /\.(xlsx|xlsm|xls)$/i.test(f.name) && !/^~\$/.test(f.name);
async function handleFiles(files) {
  const json = files.find(f => /\.json$/i.test(f.name)); if (json && files.length === 1) return restoreBackup(json);
  files = files.filter(isXl);
  if (!files.length) return toast('No Excel files found (.xlsx / .xls)', 'warn');
  const busy = showBusy(`Reading ${files.length} file(s)...`);
  const items = [];
  for (const f of files) {
    try {
      const buf = await f.arrayBuffer();
      const wb = XL.read(buf, { type: 'array', cellDates: false, dense: false });
      const fi = { name: f.name, sig: f.name + '|' + f.size + '|' + f.lastModified };
      const found = analyzeWorkbook(wb, fi);
      if (!found.length) items.push({ kind: 'unknown', file: f.name, sig: fi.sig });
      for (const it of found) { it.known = S.fileSigs[it.sig + '|' + it.kind + '|' + (it.sheet || '')]; items.push(it); }
    } catch (e) { console.error(e); items.push({ kind: 'error', file: f.name, error: String(e.message || e) }); }
    await new Promise(r => setTimeout(r, 0));
  }
  busy();
  importPreview(items);
}
function showBusy(msg) { const b = document.createElement('div'); b.className = 'busy'; b.innerHTML = `<div><span class="spin"></span>${esc(msg)}</div>`; document.body.appendChild(b); return () => b.remove(); }
const KIND = { req: 'MTO / STO PO request', sap: 'SAP STO report', design: 'Engineering MTO', po: 'P.O with work orders', unknown: 'Not recognised', error: 'Read error' };
function importPreview(items) {
  const row = (it, i) => {
    const ok = ['req', 'sap', 'design', 'po'].includes(it.kind);
    let info = '';
    if (it.kind === 'req') info = `${it.lines.length} lines · well(s) ${esc(it.wells.join(', '))} · disciplines ${esc(uniq(it.lines.map(l => l.dept || '?')).join(', '))}`;
    if (it.kind === 'sap') info = `${fmtI(it.lines.length)} STO lines · ${uniq(it.lines.map(l => l.sto)).length} STOs · ${it.wells.length} wells · statuses: ${esc(uniq(it.lines.map(l => l.status)).join(', '))}`;
    if (it.kind === 'design') info = `${it.lines.length} lines · WBS ${esc(it.meta.wbs)} · well ${esc(it.wellId)}`;
    if (it.kind === 'po') info = `${fmtI(it.count)} PO lines (sheet ${esc(it.sheet)})`;
    if (it.kind === 'unknown') info = 'No MTO / SAP / design / PO header found - skipped.';
    if (it.kind === 'error') info = esc(it.error);
    const dateFld = (it.kind === 'req' || it.kind === 'sap') ? `<label class="fld inline"><span>${it.kind === 'req' ? 'MTO date' : 'Report date'}</span><input type="date" data-idate="${i}" value="${it.date}"><small class="muted">from ${esc(it.dateSrc)}</small></label>` : '';
    return `<tr class="${ok ? '' : 'muted'}"><td><input type="checkbox" data-iinc="${i}" ${ok && !(it.known && it.kind !== 'sap') ? 'checked' : ''} ${ok ? '' : 'disabled'} aria-label="Include"></td>
      <td><span class="badge k-${it.kind}">${KIND[it.kind]}</span></td><td class="wrap"><b>${esc(it.file)}</b>${it.sheet && it.kind !== 'req' ? ` <small>[${esc(it.sheet)}]</small>` : ''}<br><small>${info}</small>${it.known ? `<br><small class="t-warn">Imported before on ${fmtDate(it.known.slice(0, 10))} - will replace.</small>` : ''}</td><td>${dateFld}</td></tr>`;
  };
  openModal({
    title: 'Import preview', wide: true,
    body: `<p class="muted small">File types are detected from the column headers. Check the dates: the MTO date drives matching with SAP STO lines; the report date decides which lines are "current".</p><div class="tbl-wrap"><table class="tbl"><thead><tr><th></th><th>Type</th><th>File</th><th>Date</th></tr></thead><tbody>${items.map(row).join('')}</tbody></table></div>`,
    actions: [{ label: 'Cancel' }, { label: 'Import selected', primary: true, onClick: m => { $$('[data-idate]', m).forEach(x => { items[+x.dataset.idate].date = x.value || todayISO(); }); const sel = items.filter((it, i) => { const c = m.querySelector(`[data-iinc="${i}"]`); return c && c.checked; }); commitImport(sel); } }]
  });
}
async function commitImport(items) {
  if (!items.length) return;
  const now = new Date().toISOString(); const msgs = [];
  for (const it of items) {
    if (it.kind === 'req') {
      const id = 'B-' + norm(it.file).replace(/ /g, '_').slice(0, 60) + '-' + it.date;
      S.batches = S.batches.filter(b => b.id !== id);
      S.batches.push({ id, file: it.file, date: it.date, imported: now, modified: Date.now(), header: it.header, sheets: it.sheets, lines: it.lines.map((l, i) => Object.assign({}, l, { id: id + '#' + i, idx: i })) });
      msgs.push(`MTO ${fmtDate(it.date)}: ${it.lines.length} lines`);
    } else if (it.kind === 'sap') {
      const id = 'S-' + it.date + '-' + norm(it.file).replace(/ /g, '_').slice(0, 50);
      S.snapshots = S.snapshots.filter(s => s.id !== id);
      S.snapshots.push({ id, file: it.file, date: it.date, imported: now, modified: Date.now(), count: it.lines.length, stos: uniq(it.lines.map(l => l.sto)).length });

      msgs.push(`SAP report ${fmtDate(it.date)}: ${fmtI(it.lines.length)} lines`);
    } else if (it.kind === 'design') {
      const id = 'E-' + norm(it.file).replace(/ /g, '_').slice(0, 60) + '-' + norm(it.sheet).replace(/ /g, '_');
      S.design = S.design.filter(d => d.id !== id);
      S.design.push({ id, file: it.file, sheet: it.sheet, imported: now, modified: Date.now(), meta: it.meta, wellId: it.wellId, lines: it.lines });
      msgs.push(`Engineering MTO ${it.wellId}: ${it.lines.length} lines`);
    } else if (it.kind === 'po') {
      if (!PO || PO.file !== it.file) PO = { file: it.file, imported: now, map: {} };
      Object.assign(PO.map, it.map); await idb.set('po', PO);
      S.poMeta = { file: it.file, imported: now, count: Object.keys(PO.map).length }; PO.imported = now; await idb.set('po', PO); Sync.queuePo();
      msgs.push(`PO lookup: ${fmtI(it.count)} lines`);
    }
    S.fileSigs[it.sig + '|' + it.kind + '|' + (it.sheet || '')] = now;
  }
  audit('Import', msgs.join('; '));
  rebuild(); persist(); render();
  toast('Imported: ' + msgs.join(' · '), 'ok', 6000);
}

  <div class="cards c2"><section class="card"><div class="card-h"><h2>Engineering MTOs</h2></div>${tbl(['Well', 'WBS', 'Doc no.', 'Lines', ''], S.design.map(d => [esc(d.wellId), esc(d.meta.wbs), esc(d.meta.docNo), d.lines.length, adm ? `<button class="btn sm danger" data-edel="${esc(d.id)}">${icon('trash')}</button>` : '']))}</section>
  <section class="card"><div class="card-h"><h2>P.O / work-order lookup</h2></div>${S.poMeta ? `<p>${esc(S.poMeta.file)} · ${fmtI(S.poMeta.count)} PO lines · ${fmtDate(S.poMeta.imported.slice(0, 10))}</p>${adm ? '<button class="btn sm danger" data-podel>Remove</button>' : ''}` : '<p class="muted">Not loaded. Optional: adds location and work-order text to wells via Service PO.</p>'}</section></div>`;
  bindDrop(el);
  el.onclick = async e => {
    const t = e.target.closest('button'); if (!t) return;
    if (t.dataset.bdel) return confirmBox('Delete MTO file', 'Remove this MTO request and its manual edits from the database?', 'Delete', () => { const b = S.batches.find(x => x.id === t.dataset.bdel); S.batches = S.batches.filter(x => x !== b); for (const l of b.lines) delete S.edits.req[l.id]; audit('Delete MTO file', b.file); commit(); });
    if (t.dataset.bdate) { const b = S.batches.find(x => x.id === t.dataset.bdate); return openModal({ title: 'MTO date', body: `<label class="fld"><span>Date of ${esc(b.file)}</span><input type="date" id="nd" value="${b.date}"></label>`, actions: [{ label: 'Cancel' }, { label: 'Save', primary: true, onClick: () => { b.date = $('#nd').value || b.date; b.modified = Date.now(); audit('Change MTO date', b.file + ' -> ' + b.date); commit(); } }] }); }
    if (t.dataset.sdel) return confirmBox('Delete SAP report', 'Remove this SAP report snapshot?', 'Delete', async () => { const id = t.dataset.sdel; const s = S.snapshots.find(x => x.id === id); S.snapshots = S.snapshots.filter(x => x.id !== id); delete SNAP[id]; await idb.del('snap:' + id); Sync.deleteSnap(id); audit('Delete SAP report', s.file); commit(); });
    if (t.dataset.edel) { S.design = S.design.filter(x => x.id !== t.dataset.edel); audit('Delete engineering MTO', t.dataset.edel); return commit(); }
    if (t.hasAttribute('data-podel')) { PO = null; S.poMeta = null; await idb.del('po'); Sync.poUnsent = false; audit('Remove PO lookup', ''); return commit(); }
    if (t.hasAttribute('data-link')) return linkFolder();
  };
};
const tbl = (h, rows) => rows.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr>${h.map(x => `<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>` : '<p class="muted">None.</p>';
async function linkFolder() {
  try {
    let h = await idb.get('dirHandle');
    if (h) { const p = await h.requestPermission({ mode: 'read' }); if (p !== 'granted') h = null; }
    if (!h) { h = await window.showDirectoryPicker({ mode: 'read' }); await idb.set('dirHandle', h); }
    const files = []; for await (const [name, fh] of h.entries()) if (fh.kind === 'file' && /\.(xlsx|xlsm|xls)$/i.test(name) && !/^~\$/.test(name)) files.push(await fh.getFile());
    if (!files.length) return toast('No Excel files in ' + h.name, 'warn');
    toast(`Scanning ${files.length} file(s) in ${h.name}`); handleFiles(files);
  } catch (e) { if (e.name !== 'AbortError') toast('Folder access not available here: ' + e.message, 'warn', 6000); }
}

/* ---------------- settings & admin ---------------- */
V.settings = el => {
  const st = S.settings; const adm = isAdmin(); const dis = adm ? '' : 'disabled';
  const statuses = uniq(Object.values(SNAP).flat().map(l => l.status)).filter(Boolean).sort();
  el.innerHTML = `${adm ? '' : `<div class="callout warn">${icon('lock')}<div>Viewer mode: settings are read-only. <a href="#" data-admin>Unlock admin</a>.</div></div>`}
  <div class="cards c2">
  <section class="card"><div class="card-h"><h2>Appearance</h2></div><div class="form2">
    <label class="fld span2"><span>Tracker name (header, browser tab, Excel title)</span><input id="sTitle" value="${esc(st.title)}" ${dis}></label>
    <label class="fld span2"><span>Subtitle</span><input id="sSub" value="${esc(st.subtitle)}" ${dis}></label>
    <label class="fld span2"><span>Export file name prefix</span><input id="sPre" value="${esc(st.exportPrefix)}" ${dis}></label>
    <label class="fld"><span>Theme</span><select id="sTheme" ${dis}>${['system', 'light', 'dark'].map(t => `<option ${st.theme === t ? 'selected' : ''}>${t}</option>`).join('')}</select></label>
    <label class="fld"><span>Density</span><select id="sDen" ${dis}>${['comfortable', 'compact'].map(t => `<option ${st.density === t ? 'selected' : ''}>${t}</option>`).join('')}</select></label>
    <label class="fld"><span>Brand colour</span><input type="color" id="sAcc" value="${esc(st.accent)}" ${dis}></label>
    <div class="fld"><span>Presets</span><div class="row-btns">${[['#204393', 'Al Tasnim blue'], ['#F48323', 'Al Tasnim orange'], ['#495053', 'Graphite'], ['#0f766e', 'Teal']].map(([c, n]) => `<button class="swatch" style="background:${c}" data-acc="${c}" title="${n}" ${dis}></button>`).join('')}</div></div>
    <div class="fld span2"><span>Company logo</span><div class="logo-row">${st.logo ? `<img src="${st.logo}" alt="Logo preview">` : '<em class="muted">No logo</em>'}
      <label class="btn sm ${adm ? '' : 'disabled'}">${icon('upload')}Upload<input type="file" accept="image/*" id="sLogo" hidden ${dis}></label>
      <button class="btn sm" data-logodef ${dis}>Default logo</button><button class="btn sm" data-logodel ${dis}>Remove</button>
      <label class="chk"><input type="checkbox" id="sShow" ${st.showLogo ? 'checked' : ''} ${dis}> Show logo</label></div></div>
  </div>${adm ? '<div class="row-btns"><button class="btn primary" data-saveapp>Save appearance</button></div>' : ''}</section>

  <section class="card"><div class="card-h"><h2>Admin access</h2></div>
    <p class="small">${hasPin() ? 'An admin PIN is set. Viewers can browse and export; import, edit, delete and settings need the PIN.' : '<b>No admin PIN set.</b> Anyone with this file can edit. Set a PIN to lock editing.'}</p>
    <div class="form2"><label class="fld"><span>${hasPin() ? 'New PIN / password' : 'Set PIN / password'}</span><input type="password" id="p1" autocomplete="new-password" ${dis}></label><label class="fld"><span>Repeat</span><input type="password" id="p2" autocomplete="new-password" ${dis}></label>
    <label class="chk span2"><input type="checkbox" id="sVI" ${st.viewerImport ? 'checked' : ''} ${dis}> Allow viewers to import new Excel files</label></div>
    ${adm ? `<div class="row-btns"><button class="btn primary" data-setpin>Save PIN</button>${hasPin() ? '<button class="btn" data-rmpin>Remove PIN</button><button class="btn" data-lock>Lock now</button>' : ''}</div>` : ''}
    <p class="muted small">The PIN is stored as a SHA-256 hash inside this browser's data. It is a convenience lock for a shared file, not server-grade security.</p></section>

  <section class="card"><div class="card-h"><h2>Matching & status logic</h2></div><div class="form2">
    <label class="fld"><span>STO may be raised up to N days before the MTO date</span><input type="number" id="lWin" min="0" max="30" value="${st.windowBefore}" ${dis}></label>
    <label class="fld"><span>"Aged pending" after N days</span><input type="number" id="lAge" min="1" value="${st.agedDays}" ${dis}></label>
    <label class="fld span2"><span>MTO lines not found in the SAP report are</span><select id="lMiss" ${dis}><option value="pending" ${st.missing === 'pending' ? 'selected' : ''}>Pending - not raised in SAP (safe default)</option><option value="issued" ${st.missing === 'issued' ? 'selected' : ''}>Assumed issued (use only if the SAP report lists open lines only and was complete)</option></select></label>
    <label class="chk span2"><input type="checkbox" id="lDrop" ${st.dropAsClosed ? 'checked' : ''} ${dis}> STO lines present in an older SAP report but missing from the latest one count as Closed / issued</label>
    <label class="chk span2"><input type="checkbox" id="lDed" ${st.dedupe ? 'checked' : ''} ${dis}> Re-requests of still-open items in a later MTO do not add to the net requirement</label>
  </div>
  <h3 class="mt">SAP status mapping</h3><div class="tbl-wrap"><table class="tbl"><thead><tr><th>SAP "STO Status"</th><th>Tracker stage</th></tr></thead><tbody>${(statuses.length ? statuses : DEFAULT_STATUS_MAP.map(x => x[0])).map(s => `<tr><td>${esc(s)}</td><td><select data-smap="${esc(s)}" ${dis}>${Object.entries(STAGES).filter(([k]) => !['NOT_RAISED', 'PRIOR_PENDING', 'ASSUMED_ISSUED'].includes(k)).map(([k, v]) => `<option value="${k}" ${mapStatus(s) === k ? 'selected' : ''}>${esc(v.label)}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div>
  ${adm ? '<div class="row-btns"><button class="btn primary" data-savelogic>Save logic</button></div>' : ''}</section>

  <section class="card"><div class="card-h"><h2>Team database (Google Drive)</h2><span class="sync-chip sc-${Sync.status}">${icon('cloud')}<span>${Sync.on() ? (Sync.status === 'error' ? 'Offline' : 'Connected') : 'Not connected'}</span></span></div>
    <p class="small">Saves to a Drive folder through your Google Apps Script Web App (see <code>apps-script/SETUP.md</code>). Everyone with the Web App URL and team key shares one database; changes sync every minute and are merged if two people save at once. Connection details stay in this browser only.</p>
    <div class="form2">
      <label class="fld span2"><span>Web App URL (ends with /exec)</span><input id="cUrl" value="${esc(Sync.cfg().url || '')}" placeholder="https://script.google.com/macros/s/.../exec"></label>
      <label class="fld"><span>Team key</span><input id="cKey" type="password" value="${esc(Sync.cfg().key || '')}" autocomplete="off"></label>
      <label class="fld"><span>Your name (shown in the activity log)</span><input id="cName" value="${esc(Sync.cfg().name || '')}" placeholder="e.g. Ayaz"></label>
    </div>
    <div class="row-btns"><button class="btn primary" data-cconnect>${icon('cloud')}${Sync.on() ? 'Save & reconnect' : 'Connect'}</button>${Sync.on() ? '<button class="btn" data-csync>Sync now</button><button class="btn" data-cdisc>Disconnect</button>' : ''}</div>
    ${Sync.on() ? `<p class="muted small">Revision ${Sync.rev} · last sync ${Sync.last ? Sync.last.toLocaleTimeString() : '-'}${Sync.msg ? ' · ' + esc(Sync.msg) : ''}</p>` : ''}</section>

  <section class="card"><div class="card-h"><h2>Backup, restore, reset</h2></div>
    <p class="small">Data lives in this browser only (IndexedDB, per PC and per browser). Take a backup after each update and keep it next to the HTML on Google Drive / GitHub. Restoring replaces the current data.</p>
    <div class="row-btns"><button class="btn primary" data-backup>${icon('download')}Download backup (.json)</button><label class="btn ${adm ? '' : 'disabled'}">${icon('upload')}Restore backup<input type="file" accept=".json" id="rIn" hidden ${dis}></label>${adm ? `<button class="btn danger" data-reset>${icon('trash')}Reset database</button>` : ''}</div>
    <h3 class="mt">Activity log</h3><div class="audit">${S.audit.slice(0, 120).map(a => `<div><time>${esc(a.ts.slice(0, 16).replace('T', ' '))}</time><b>${esc(a.action)}</b><span>${esc(a.detail)}</span><em>${esc(a.who)}</em></div>`).join('') || '<p class="muted">No activity yet.</p>'}</div></section>
  </div>
  <section class="card about"><h2>How the tracker reads your files</h2><ol class="small">
    <li><b>MTO request</b>: each line = well (Well ID / WBS), material, requested qty, discipline (Department). The file date comes from the name (e.g. <code>_19.10.26</code>).</li>
    <li><b>SAP STO report</b>: each line = STO / item, target WBS (well), material, qty, STO status. "Pending WBS to WBS Transfer" = waiting for the PE; "STO Created" / "Pending Delivery" = approved; "Pending Goods Receipt", received qty or GR doc = issued.</li>
    <li><b>Matching</b>: an STO line belongs to the latest MTO of the same well dated on or before the STO date (+ tolerance). Quantities are allocated issued → approved → pending; the rest is <b>not raised</b>.</li>
    <li><b>Already requested</b>: the same well + material is still open in an STO raised before this MTO. <b>Double entry</b>: raised in more than one STO, on the same day, or above the requested qty.</li>
    <li><b>Net required</b> per well + material avoids counting re-requests twice; <b>Balance</b> = net required - issued; <b>Excess in SAP</b> = open STO qty above the balance.</li></ol></section>`;
  el.querySelector('[data-cconnect]').onclick = async () => {
    const url = $('#cUrl').value.trim(), key = $('#cKey').value.trim(), name = $('#cName').value.trim();
    if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(url)) return toast('Paste the Apps Script Web App URL (https://script.google.com/.../exec)', 'warn', 6000);
    if (!key) return toast('Enter the team key', 'warn');
    Sync.saveCfg({ url, key, name, enabled: true });
    const done = showBusy('Connecting to the team database...');
    try { const info = await Sync.connect(); done(); audit('Connected to team database', info.folder || ''); persist(true); toast('Connected. Team database revision ' + Sync.rev, 'ok', 5000); if (!Sync.started) { Sync.started = true; Sync.start(); } render(); }
    catch (e) { done(); Sync.setStatus('error', e.message); toast('Connection failed: ' + e.message, 'bad', 8000); }
  };
  const cs = el.querySelector('[data-csync]'); if (cs) cs.onclick = async () => { await Sync.pull({ verbose: true }); if (Sync.dirty) await Sync.push(); render(); toast('Sync done', 'ok'); };
  const cd = el.querySelector('[data-cdisc]'); if (cd) cd.onclick = () => confirmBox('Disconnect', 'Stop syncing this browser? Data stays here and in Drive.', 'Disconnect', () => { const c = Sync.cfg(); c.enabled = false; Sync.saveCfg(c); Sync.setStatus('off'); render(); }, false);
  if (!adm) return;
  el.querySelectorAll('[data-acc]').forEach(b => b.onclick = () => { $('#sAcc').value = b.dataset.acc; });
  const lf = $('#sLogo'); if (lf) lf.onchange = () => { const f = lf.files[0]; if (!f) return; if (f.size > 1.5e6) return toast('Logo too large (max 1.5 MB)', 'warn'); const r = new FileReader(); r.onload = () => { st.logo = r.result; st.showLogo = true; audit('Logo uploaded', f.name); persist(); render(); }; r.readAsDataURL(f); };
  el.querySelector('[data-logodef]').onclick = () => { st.logo = DEFAULT_LOGO; st.showLogo = true; persist(); render(); };
  el.querySelector('[data-logodel]').onclick = () => { st.logo = ''; audit('Logo removed', ''); persist(); render(); };
  el.querySelector('[data-saveapp]').onclick = () => { Object.assign(st, { title: $('#sTitle').value.trim() || DEFAULT_TITLE, subtitle: $('#sSub').value.trim(), exportPrefix: $('#sPre').value.trim() || 'Tracker', theme: $('#sTheme').value, density: $('#sDen').value, accent: $('#sAcc').value, showLogo: $('#sShow').checked }); audit('Appearance saved', st.title); persist(); render(); toast('Appearance saved', 'ok'); };
  el.querySelector('[data-setpin]').onclick = () => { const a = $('#p1').value, b = $('#p2').value; if (a.length < 4) return toast('Use at least 4 characters', 'warn'); if (a !== b) return toast('PINs do not match', 'warn'); st.adminHash = sha256('atnm|' + a); st.viewerImport = $('#sVI').checked; ADMIN = true; try { sessionStorage.setItem('atnm_admin', st.adminHash); } catch (e) { } audit('Admin PIN set', ''); persist(); render(); toast('PIN saved. You stay unlocked in this session.', 'ok'); };
  const rm = el.querySelector('[data-rmpin]'); if (rm) rm.onclick = () => confirmBox('Remove PIN', 'Everyone will be able to edit. Continue?', 'Remove PIN', () => { st.adminHash = ''; audit('Admin PIN removed', ''); persist(); render(); });
  const lk = el.querySelector('[data-lock]'); if (lk) lk.onclick = () => { ADMIN = false; try { sessionStorage.removeItem('atnm_admin'); } catch (e) { } render(); };
  el.querySelector('[data-savelogic]').onclick = () => {
    Object.assign(st, { windowBefore: Math.max(0, +$('#lWin').value || 0), agedDays: Math.max(1, +$('#lAge').value || 30), missing: $('#lMiss').value, dropAsClosed: $('#lDrop').checked, dedupe: $('#lDed').checked });
    const map = st.statusMap.filter(([k]) => !$$('[data-smap]', el).some(s => norm(s.dataset.smap) === norm(k)));
    $$('[data-smap]', el).forEach(s => map.unshift([norm(s.dataset.smap), s.value])); st.statusMap = map;
    audit('Logic saved', JSON.stringify({ w: st.windowBefore, a: st.agedDays, m: st.missing, d: st.dropAsClosed, dd: st.dedupe })); commit(); toast('Logic saved and data recalculated', 'ok');
  };
  el.querySelector('[data-reset]').onclick = () => confirmBox('Reset database', Sync.on() ? 'Clear this browser copy and download a fresh copy from the team database on Drive? The team database is not changed.' : 'Delete ALL imported files, edits and settings stored in this browser? Download a backup first. This cannot be undone.', Sync.on() ? 'Clear and reload' : 'Reset everything', async () => { const cloud = Sync.on(); await idb.clear(); const ui = S.ui; S = blankState(); S.ui = ui; SNAP = {}; PO = null; ADMIN = false; Sync.rev = -1; Sync.base = null; Sync.dirty = false; Sync.unsentSnaps.clear(); Sync.poUnsent = false; await Sync.saveMeta(); rebuild(); persist(true); if (cloud) await Sync.pull({ verbose: true }); render(); toast(cloud ? 'Reloaded from the team database' : 'Database reset'); });
  $('#rIn').onchange = e => { const f = e.target.files[0]; if (f) restoreBackup(f); };
};
function backup() {
  const data = { app: 'atnm-mto-sto-tracker', version: VERSION, exported: new Date().toISOString(), state: S, snaps: SNAP, po: PO };
  download(`${S.settings.exportPrefix} - Tracker Backup - ${todayISO()}.json`, new Blob([JSON.stringify(data)], { type: 'application/json' }));
  audit('Backup downloaded', ''); persist(); toast('Backup downloaded', 'ok');
}
async function restoreBackup(file) {
  if (!needAdmin(() => restoreBackup(file))) return;
  try {
    const d = JSON.parse(await file.text()); if (d.app !== 'atnm-mto-sto-tracker' || !d.state) throw new Error('not a tracker backup');
    confirmBox('Restore backup', `${Sync.on() ? 'This will also replace the TEAM database on Drive. ' : ''}Replace the current database with the backup from ${esc((d.exported || '').slice(0, 10))} (${(d.state.batches || []).length} MTO files, ${(d.state.snapshots || []).length} SAP reports)?`, 'Restore', async () => {
      await idb.clear(); S = Object.assign(blankState(), d.state); S.settings = Object.assign(defaultSettings(), d.state.settings || {}); SNAP = d.snaps || {}; PO = d.po || null;
      for (const k in SNAP) { await idb.set('snap:' + k, SNAP[k]); Sync.queueSnap(k); } if (PO) { await idb.set('po', PO); Sync.queuePo(); }
      audit('Backup restored', file.name); rebuild(); persist(); render(); toast('Backup restored', 'ok');
    }, false);
  } catch (e) { toast('Restore failed: ' + e.message, 'bad', 6000); }
}

/* ---------------- init ---------------- */
async function init() {
  STORAGE_OK = await idb.open();
  if (STORAGE_OK) {
    const s = await idb.get('state');
    if (s) { S = Object.assign(blankState(), s); S.settings = Object.assign(defaultSettings(), s.settings || {}); S.edits = Object.assign({ req: {}, sto: {}, mat: {} }, s.edits || {}); S.ui = Object.assign(blankState().ui, s.ui || {}); }
    for (const sp of S.snapshots) SNAP[sp.id] = (await idb.get('snap:' + sp.id)) || [];
    PO = (await idb.get('po')) || null;
  } else toast('Browser storage is blocked: data will not be kept after closing. Use backups.', 'warn', 9000);
  try { const u = JSON.parse(localStorage.getItem('atnm_ui') || 'null'); if (u) S.ui = Object.assign(blankState().ui, u); } catch (e) { }
  await Sync.loadMeta();
  try { if (S.settings.adminHash && sessionStorage.getItem('atnm_admin') === S.settings.adminHash) ADMIN = true; } catch (e) { }
  if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (S.settings.theme === 'system') applyAppearance(); });
  rebuild(); render();
  if (Sync.on()) { Sync.started = true; Sync.start(); }
  window.ATNM = { get state() { return S; }, get data() { return D; }, handleFiles, commitImport, analyzeWorkbook, rebuild, render, Sync, mergeStates };
}
init();

})();
